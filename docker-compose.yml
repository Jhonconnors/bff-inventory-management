services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sigati
      POSTGRES_USER: sigati
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigati-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigati -d sigati"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://sigati:${POSTGRES_PASSWORD:-sigati-local}@db:5432/sigati
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your environment}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: