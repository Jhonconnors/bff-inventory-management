services:
  db:
    image: sigati-db:local
    build:
      context: ./database
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inventario_tecnologico}
      POSTGRES_USER: ${POSTGRES_USER:-sigati}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sigati-local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigati} -d ${POSTGRES_DB:-inventario_tecnologico}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: sigati-api:local
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-sigati}:${POSTGRES_PASSWORD:-sigati-local}@db:5432/${POSTGRES_DB:-inventario_tecnologico}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your environment}
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    image: sigati-frontend:local
    build:
      context: ../mfe-inventory-management
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data: