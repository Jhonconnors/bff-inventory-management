    get:
      tags: [TiposEquipo]
      summary: Consultar tipo de equipo
      responses:
        '200':
          description: Tipo de equipo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TipoEquipo' }
    put:
      tags: [TiposEquipo]
      summary: Actualizar tipo de equipo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogCreate' }
      responses:
        '200':
          description: Tipo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TipoEquipo' }
    delete:
      tags: [TiposEquipo]
      summary: Eliminar tipo sin activos relacionados
      responses:
        '204': { description: Tipo eliminado }

  /estados-equipo:
    get:
      tags: [EstadosEquipo]
      summary: Listar estados de equipo
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Estados de equipo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EstadoEquipo' }
    post:
      tags: [EstadosEquipo]
      summary: Crear estado de equipo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogCreate' }
      responses:
        '201':
          description: Estado creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoEquipo' }

  /estados-equipo/{entity_id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      tags: [EstadosEquipo]
      summary: Consultar estado de equipo
      responses:
        '200':
          description: Estado de equipo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoEquipo' }
    put:
      tags: [EstadosEquipo]
      summary: Actualizar estado de equipo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogCreate' }
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EstadoEquipo' }
    delete:
      tags: [EstadosEquipo]
      summary: Eliminar estado sin activos relacionados
      responses:
        '204': { description: Estado eliminado }

  /auditoria:
    get:
      tags:
        - Auditoria
      summary: Consultar auditoría
      responses:
        '200':
          description: Eventos auditoría
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Auditoria'

  /auditoria/{id_evento}:
    parameters:
      - name: id_evento
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Auditoria
      summary: Obtener evento
      responses:
        '200':
          description: Evento auditoría
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auditoria'

  /health:
    get:
      security: []
      tags:
        - Sistema
      summary: Health Check
      responses:
        '200':
          description: Estado API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /version:
    get:
      security: []
      tags:
        - Sistema
      summary: Versión desplegada
      responses:
        '200':
          description: Versión actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'


#components
components:
  securitySchemes:
    bearerAuth: # arbitrary name for the security scheme
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:

    Ok:
      description: Operación exitosa

    Created:
      description: Recurso creado correctamente

    NoContent:
      description: Operación completada

    BadRequest:
      description: Solicitud inválida

    Unauthorized:
      description: No autorizado

    Forbidden:
      description: Permisos insuficientes

    NotFound:
      description: Recurso no encontrado

  schemas:

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string

    Rol:
      type: object
      properties:
        id_rol:
          type: integer
        nombre:
          type: string

    Usuario:
      type: object
      properties:
        id_usuario:
          type: integer
        nombre:
          type: string
        correo:
          type: string
          format: email
        activo:
          type: boolean
        id_rol:
          type: integer

    UsuarioCreate:
      type: object
      required:
        - nombre
        - correo
        - password
        - id_rol
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        correo:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          minLength: 12
          maxLength: 255
        id_rol:
          type: integer
          minimum: 1

    UsuarioUpdate:
      type: object
      required: [nombre, correo, id_rol]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        correo:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
