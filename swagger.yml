openapi: 3.0.3

info:
  title: MVP Inventario Trazable
  version: 1.0.0
  description: API del proyecto MVP Inventario Trazable para gestión de activos tecnológicos.

servers:
  - url: http://localhost:8000/api/v1

tags:
  - name: Authentication
  - name: Usuarios
  - name: Roles
  - name: Activos
  - name: Auditoria
  - name: Sucursales
  - name: Departamentos
  - name: Marcas
  - name: Modelos
  - name: TiposEquipo
  - name: EstadosEquipo
  - name: Sistema

paths:

  /authentication/login:
    post:
      security: []
      tags:
        - Authentication
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /authentication/refresh:
    post:
      security: []
      tags:
        - Authentication
      summary: Renovar token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /authentication/me:
    get:
      tags:
        - Authentication
      summary: Usuario autenticado
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'

  /authentication/logout:
    post:
      tags:
        - Authentication
      summary: Revocar access token y refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens revocados hasta su expiración

  /usuarios:
    get:
      tags:
        - Usuarios
      summary: Listar usuarios
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'

    post:
      tags:
        - Usuarios
      summary: Crear usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCreate'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'

  /usuarios/{id_usuario}:
    parameters:
      - name: id_usuario
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Usuarios
      summary: Obtener usuario
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'

    put:
      tags:
        - Usuarios
      summary: Modificar usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: '#/components/schemas/UsuarioUpdate'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'

    delete:
      tags:
        - Usuarios
      summary: Eliminar usuario permanentemente
      responses:
        '204':
          description: Usuario eliminado
        '409':
          description: No se puede eliminar si conserva eventos de auditoría o activos asignados; en ese caso, desactívelo

  /usuarios/{id_usuario}/activar:
    parameters:
      - name: id_usuario
        in: path
        required: true
        schema:
          type: integer

    patch:
      tags:
        - Usuarios
      summary: Activar usuario
      responses:
        '200':
          description: Usuario activado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'

  /usuarios/{id_usuario}/desactivar:
    parameters:
      - name: id_usuario
        in: path
        required: true
        schema:
          type: integer

    patch:
      tags:
        - Usuarios
      summary: Desactivar usuario
      responses:
        '200':
          description: Usuario desactivado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'

  /roles:
    get:
      tags:
        - Roles
      summary: Listar roles
      responses:
        '200':
          description: Lista roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rol'

    post:
      tags:
        - Roles
      summary: Crear rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rol'
      responses:
        '201':
          description: Rol creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rol'

  /roles/{id_rol}:
    parameters:
      - name: id_rol
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Roles
      summary: Obtener rol
      responses:
        '200':
          description: Rol encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rol'

    put:
      tags:
        - Roles
      summary: Modificar rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rol'
      responses:
        '200':
          description: Rol actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rol'

    delete:
      tags:
        - Roles
      summary: Eliminar rol
      responses:
        '204':
          description: Rol eliminado

  /activos:
    get:
      tags:
        - Activos
      summary: Listar activos
      responses:
        '200':
          description: Lista activos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activo'

    post:
      tags:
        - Activos
      summary: Registrar activo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivoCreate'
      responses:
        '201':
          description: Activo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activo'

  /activos/busqueda:
    get:
      tags:
        - Activos
      summary: Búsqueda avanzada
      parameters:
        - name: placa
          in: query
          schema:
            type: string
        - name: serie
          in: query
          schema:
            type: string
        - name: id_usuario
          in: query
          schema:
            type: integer
        - name: id_departamento
          in: query
          schema:
            type: integer
        - name: id_sucursal
          in: query
          schema:
            type: integer
        - name: id_estado
          in: query
          schema:
            type: integer
        - name: id_tipo
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0

      responses:
        '200':
          description: Resultado búsqueda
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activo'

  /activos/{id_activo}:
    parameters:
      - name: id_activo
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Activos
      summary: Obtener activo
      responses:
        '200':
          description: Activo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activo'

    put:
      tags:
        - Activos
      summary: Modificar activo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivoUpdate'
      responses:
        '200':
          description: Activo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activo'

    delete:
      tags:
        - Activos
      summary: Baja lógica
      responses:
        '204':
          description: Activo eliminado

  /activos/{id_activo}/historial:
    parameters:
      - name: id_activo
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Activos
      summary: Historial del activo
      responses:
        '200':
          description: Historial de auditoría
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Auditoria'

  /activos/{id_activo}/asignar:
    parameters:
      - name: id_activo
        in: path
        required: true
        schema:
          type: integer
    post:
      tags:
        - Activos
      summary: Asignar custodio y ubicación en una transacción
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignacionRequest'
      responses:
        '200':
          description: Activo asignado y auditado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /activos/{id_activo}/trasladar:
    parameters:
      - name: id_activo
        in: path
        required: true
        schema:
          type: integer
    post:
      tags:
        - Activos
      summary: Trasladar activo y actualizar custodio y ubicación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrasladoRequest'
      responses:
        '200':
          description: Activo trasladado y auditado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /activos/{id_activo}/devolver:
    parameters:
      - name: id_activo
        in: path
        required: true
        schema:
          type: integer
    post:
      tags:
        - Activos
      summary: Devolver activo a bodega
      responses:
        '200':
          description: Activo devuelto y auditado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activo'

  /activos/{id_activo}/baja:
    parameters:
      - name: id_activo
        in: path
        required: true
        schema:
          type: integer
    post:
      tags:
        - Activos
      summary: Dar de baja un activo y registrar su resolución
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BajaRequest'
      responses:
        '200':
          description: Activo dado de baja y auditado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activo'

  /sucursales:
    get:
      tags: [Sucursales]
      summary: Listar sucursales
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Sucursales
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sucursal' }
    post:
      tags: [Sucursales]
      summary: Crear sucursal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogCreate' }
      responses:
        '201':
          description: Sucursal creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sucursal' }

  /sucursales/{entity_id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      tags: [Sucursales]
      summary: Consultar sucursal
      responses:
        '200':
          description: Sucursal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sucursal' }
    put:
      tags: [Sucursales]
      summary: Actualizar sucursal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogCreate' }
      responses:
        '200':
          description: Sucursal actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sucursal' }
    delete:
      tags: [Sucursales]
      summary: Eliminar sucursal sin activos relacionados
      responses:
        '204': { description: Sucursal eliminada }

  /departamentos:
    get:
      tags: [Departamentos]
      summary: Listar departamentos
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Departamentos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Departamento' }
    post:
      tags: [Departamentos]
      summary: Crear departamento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogCreate' }
      responses:
        '201':
          description: Departamento creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Departamento' }

  /departamentos/{entity_id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      tags: [Departamentos]
      summary: Consultar departamento
      responses:
        '200':
          description: Departamento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Departamento' }
    put:
      tags: [Departamentos]
      summary: Actualizar departamento
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogCreate' }
      responses:
        '200':
          description: Departamento actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Departamento' }
    delete:
      tags: [Departamentos]
      summary: Eliminar departamento sin activos relacionados
      responses:
        '204': { description: Departamento eliminado }

  /marcas:
    get:
      tags: [Marcas]
      summary: Listar marcas
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Marcas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Marca' }
    post:
      tags: [Marcas]
      summary: Crear marca
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogCreate' }
      responses:
        '201':
          description: Marca creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Marca' }

  /marcas/{entity_id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      tags: [Marcas]
      summary: Consultar marca
      responses:
        '200':
          description: Marca
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Marca' }
    put:
      tags: [Marcas]
      summary: Actualizar marca
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogCreate' }
      responses:
        '200':
          description: Marca actualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Marca' }
    delete:
      tags: [Marcas]
      summary: Eliminar marca sin modelos relacionados
      responses:
        '204': { description: Marca eliminada }

  /modelos:
    get:
      tags: [Modelos]
      summary: Listar modelos
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Modelos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Modelo' }
    post:
      tags: [Modelos]
      summary: Crear modelo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModeloCreate' }
      responses:
        '201':
          description: Modelo creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Modelo' }

  /modelos/{entity_id}:
    parameters:
      - $ref: '#/components/parameters/EntityId'
    get:
      tags: [Modelos]
      summary: Consultar modelo
      responses:
        '200':
          description: Modelo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Modelo' }
    put:
      tags: [Modelos]
      summary: Actualizar modelo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModeloCreate' }
      responses:
        '200':
          description: Modelo actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Modelo' }
    delete:
      tags: [Modelos]
      summary: Eliminar modelo sin activos relacionados
      responses:
