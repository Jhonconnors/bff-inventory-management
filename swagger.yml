openapi: 3.0.3

info:
  title: MVP Inventario Trazable
  version: 1.0.0
  description: Sistema de Gestión de Activos Tecnológicos

servers:
  - url: http://localhost:8000/api/v1

tags:
  - name: Authentications
  - name: Usuarios
  - name: Roles
  - name: Activos
  - name: Auditoria
  - name: Catalogos
  - name: Migracion
  - name: Sistema

paths:

  /authentication/login:
    post:
      tags:
        -  Authentications
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /authentication/refresh:
    post:
      tags:
        - Authentications
      summary: Renovar token
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'

  /authentication/me:
    get:
      tags:
        - Authentications
      summary: Usuario autenticado
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'

  /authentication/logout:
    post:
      tags:
        - Authentications
      summary: Cerrar sesión
      responses:
        '200':
          description: Sesión cerrada

  /usuarios:
    get:
      tags:
        - Usuarios
      summary: Listar usuarios
      responses:
        '200':
          description: Lista de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'

    post:
      tags:
        - Usuarios
      summary: Crear usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCreate'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'

  /usuarios/{id_usuario}:
    parameters:
      - name: id_usuario
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Usuarios
      summary: Obtener usuario
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'

    put:
      tags:
        - Usuarios
      summary: Modificar usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCreate'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'

    delete:
      tags:
        - Usuarios
      summary: Eliminar usuario
      responses:
        '204':
          description: Usuario eliminado

  /usuarios/{id_usuario}/activar:
    parameters:
      - name: id_usuario
        in: path
        required: true
        schema:
          type: integer

    patch:
      tags:
        - Usuarios
      summary: Activar usuario
      responses:
        '200':
          description: Usuario activado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'

  /usuarios/{id_usuario}/desactivar:
    parameters:
      - name: id_usuario
        in: path
        required: true
        schema:
          type: integer

    patch:
      tags:
        - Usuarios
      summary: Desactivar usuario
      responses:
        '200':
          description: Usuario desactivado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'

  /roles:
    get:
      tags:
        - Roles
      summary: Listar roles
      responses:
        '200':
          description: Lista roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Rol'

    post:
      tags:
        - Roles
      summary: Crear rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rol'
      responses:
        '201':
          description: Rol creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rol'

  /roles/{id_rol}:
    parameters:
      - name: id_rol
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Roles
      summary: Obtener rol
      responses:
        '200':
          description: Rol encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rol'

    put:
      tags:
        - Roles
      summary: Modificar rol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rol'
      responses:
        '200':
          description: Rol actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rol'

    delete:
      tags:
        - Roles
      summary: Eliminar rol
      responses:
        '204':
          description: Rol eliminado

  /activos:
    get:
      tags:
        - Activos
      summary: Listar activos
      responses:
        '200':
          description: Lista activos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activo'

    post:
      tags:
        - Activos
      summary: Registrar activo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivoCreate'
      responses:
        '201':
          description: Activo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activo'

  /activos/busqueda:
    get:
      tags:
        - Activos
      summary: Búsqueda avanzada
      parameters:
        - name: placa
          in: query
          schema:
            type: string
        - name: serie
          in: query
          schema:
            type: string
        - name: usuario
          in: query
          schema:
            type: integer
        - name: departamento
          in: query
          schema:
            type: integer
        - name: sucursal
          in: query
          schema:
            type: integer
        - name: estado
          in: query
          schema:
            type: integer
        - name: tipo
          in: query
          schema:
            type: integer

      responses:
        '200':
          description: Resultado búsqueda
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Activo'

  /activos/{id_activo}:
    parameters:
      - name: id_activo
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Activos
      summary: Obtener activo
      responses:
        '200':
          description: Activo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activo'

    put:
      tags:
        - Activos
      summary: Modificar activo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivoUpdate'
      responses:
        '200':
          description: Activo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activo'

    delete:
      tags:
        - Activos
      summary: Baja lógica
      responses:
        '204':
          description: Activo eliminado

  /activos/{id_activo}/historial:
    parameters:
      - name: id_activo
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Activos
      summary: Historial del activo
      responses:
        '200':
          description: Historial de auditoría
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Auditoria'

  /auditoria:
    get:
      tags:
        - Auditoria
      summary: Consultar auditoría
      responses:
        '200':
          description: Eventos auditoría
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Auditoria'

  /auditoria/{id_evento}:
    parameters:
      - name: id_evento
        in: path
        required: true
        schema:
          type: integer

    get:
      tags:
        - Auditoria
      summary: Obtener evento
      responses:
        '200':
          description: Evento auditoría
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Auditoria'

  /dashboard/resumen:
    get:
      tags:
        - Sistema
      responses:
        '200':
          description: Dashboard resumen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResumen'

  /health:
    get:
      tags:
        - Sistema
      summary: Health Check
      responses:
        '200':
          description: Estado API
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /version:
    get:
      tags:
        - Sistema
      summary: Versión desplegada
      responses:
        '200':
          description: Versión actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionResponse'


#components
components:
  securitySchemes:
    bearerAuth: # arbitrary name for the security scheme
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:

    Ok:
      description: Operación exitosa

    Created:
      description: Recurso creado correctamente

    NoContent:
      description: Operación completada

    BadRequest:
      description: Solicitud inválida

    Unauthorized:
      description: No autorizado

    NotFound:
      description: Recurso no encontrado

  schemas:

    Rol:
      type: object
      properties:
        id_rol:
          type: integer
        nombre:
          type: string

    Usuario:
      type: object
      properties:
        id_usuario:
          type: integer
        nombre:
          type: string
        correo:
          type: string
          format: email
        activo:
          type: boolean
        id_rol:
          type: integer

    UsuarioCreate:
      type: object
      required:
        - nombre
        - correo
        - password
        - id_rol
      properties:
        nombre:
          type: string
        correo:
          type: string
          format: email
        password:
          type: string
        id_rol:
          type: integer

    LoginRequest:
      type: object
      required:
        - correo
        - password
      properties:
        correo:
          type: string
          format: email
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string

    Sucursal:
      type: object
      properties:
        id_sucursal:
          type: integer
        nombre:
          type: string

    Departamento:
      type: object
      properties:
        id_departamento:
          type: integer
        nombre:
          type: string

    Marca:
      type: object
      properties:
        id_marca:
          type: integer
        nombre:
          type: string

    Modelo:
      type: object
      properties:
        id_modelo:
          type: integer
        nombre:
          type: string
        id_marca:
          type: integer

    TipoEquipo:
      type: object
      properties:
        id_tipo:
          type: integer
        nombre:
          type: string

    EstadoEquipo:
      type: object
      properties:
        id_estado:
          type: integer
        nombre:
          type: string

    Activo:
      type: object
      properties:
        id_activo:
          type: integer
        placa:
          type: string
        serie:
          type: string
        mac:
          type: string
        posicion_monitor:
          type: string
        fecha_registro:
          type: string
          format: date-time
        id_tipo:
          type: integer
        id_marca:
          type: integer
        id_modelo:
          type: integer
        id_estado:
          type: integer
        id_sucursal:
          type: integer
        id_departamento:
          type: integer
        id_usuario:
          type: integer

    ActivoCreate:
      type: object
      required:
        - placa
        - serie
        - id_tipo
        - id_marca
        - id_modelo
        - id_estado
        - id_sucursal
        - id_departamento
      properties:
        placa:
          type: string
        serie:
          type: string
        mac:
          type: string
        posicion_monitor:
          type: string
        id_tipo:
          type: integer
        id_marca:
          type: integer
        id_modelo:
          type: integer
        id_estado:
          type: integer
        id_sucursal:
          type: integer
        id_departamento:
          type: integer
        id_usuario:
          type: integer

    ActivoUpdate:
      allOf:
        - $ref: '#/components/schemas/ActivoCreate'

    Auditoria:
      type: object
      properties:
        id_evento:
          type: integer
        accion:
          type: string
        detalle:
          type: string
        fecha_hora:
          type: string
          format: date-time
        id_activo:
          type: integer
        id_usuario:
          type: integer

    DashboardResumen:
      type: object
      properties:
        total_activos:
          type: integer
        total_usuarios:
          type: integer
        total_sucursales:
          type: integer

    HealthResponse:
      type: object
      properties:
        status:
          type: string

    VersionResponse:
      type: object
      properties:
        version:
          type: string
# 2) Apply the security globally to all operations
security:
  - bearerAuth: []