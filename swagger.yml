  /tipos-equipo:
    get:
      tags: [TiposEquipo]
      summary: Listar tipos de equipo
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Tipos de equipo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TipoEquipo' }
    post:
      tags: [TiposEquipo]
      summary: Crear tipo de equipo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogCreate' }
      responses:
        '201':
          description: Tipo creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TipoEquipo' }

  /tipos-equipo/{entity_id}:
    parameters:
